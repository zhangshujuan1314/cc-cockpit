name: Bootstrap Sanitized Demo Assets

on:
  push:
    branches: [publication/sanitized-demo-assets]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/sanitized-demo-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=optional
      - name: Prepare sanitized Claude session fixture
        run: |
          mkdir -p "$HOME/.claude/projects/demo-project"
          cp demo/sanitized-session.jsonl "$HOME/.claude/projects/demo-project/demo-session.jsonl"
          mkdir -p /tmp/cc-cockpit-demo/src
          printf 'export function authorize(req, res, next) {\n  return next();\n}\n' > /tmp/cc-cockpit-demo/src/auth.js
      - name: Start real CC Cockpit server
        run: |
          node core/server.js > /tmp/cc-cockpit.log 2>&1 &
          echo $! > /tmp/cc-cockpit.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3777/api/sessions | grep -q 'demo-session'; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cc-cockpit.log
          exit 1
      - name: Install isolated capture browser
        run: |
          mkdir -p /tmp/capture-tool
          cd /tmp/capture-tool
          npm init -y >/dev/null
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real UI from sanitized demo data
        run: |
          mkdir -p docs/assets
          cat > /tmp/capture-tool/capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'fs';
          import path from 'path';

          const root = process.env.GITHUB_WORKSPACE;
          const out = path.join(root, 'docs', 'assets');
          const asset = name => path.join(out, name);
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            recordVideo: { dir: '/tmp/cc-cockpit-video', size: { width: 1440, height: 900 } }
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:3777', { waitUntil: 'networkidle' });
          await page.locator('.session').first().waitFor({state:'visible'});
          await page.locator('.session').first().click();
          await page.locator('.msg').first().waitFor({state:'visible'});
          await page.waitForTimeout(700);
          await page.screenshot({path:asset('cc-cockpit-overview.png')});

          const tool = page.locator('.tool').first();
          await tool.scrollIntoViewIfNeeded();
          await tool.click();
          await page.waitForTimeout(350);
          await page.screenshot({path:asset('cc-cockpit-tool-call.png')});

          const file = page.locator('.file').first();
          await file.waitFor({state:'visible'});
          await file.scrollIntoViewIfNeeded();
          await file.click();
          await page.waitForTimeout(350);
          await page.screenshot({path:asset('cc-cockpit-file-panel.png')});

          await page.locator('#m-cost-card').click();
          await page.locator('.modal').waitFor({state:'visible'});
          await page.waitForTimeout(350);
          await page.screenshot({path:asset('cc-cockpit-cost-settings.png')});

          await page.locator('#pc').click();
          await page.waitForTimeout(500);
          const video = page.video();
          await page.close();
          await video.saveAs(asset('cc-cockpit-demo.webm'));
          await context.close();
          await browser.close();

          for (const name of [
            'cc-cockpit-overview.png',
            'cc-cockpit-tool-call.png',
            'cc-cockpit-file-panel.png',
            'cc-cockpit-cost-settings.png',
            'cc-cockpit-demo.webm'
          ]) {
            const p = asset(name);
            if (!fs.existsSync(p) || fs.statSync(p).size === 0) throw new Error(`missing asset: ${p}`);
            console.log(`${name}: ${fs.statSync(p).size} bytes`);
          }
          NODE
          cd /tmp/capture-tool
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node capture.mjs
      - name: Verify publication fixture is sanitized
        run: |
          test -s docs/assets/cc-cockpit-overview.png
          test -s docs/assets/cc-cockpit-tool-call.png
          test -s docs/assets/cc-cockpit-file-panel.png
          test -s docs/assets/cc-cockpit-cost-settings.png
          test -s docs/assets/cc-cockpit-demo.webm
          grep -q 'demo-session' demo/sanitized-session.jsonl
          if grep -Eqi 'zhangshujuan1314|api[_-]?key|sk-[A-Za-z0-9]' demo/sanitized-session.jsonl; then
            echo 'Private-looking material found in demo fixture.' >&2
            exit 1
          fi
      - name: Commit generated publication assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/sanitized-session.jsonl docs/assets/
          if git diff --cached --quiet; then
            echo 'No generated asset changes.'
            exit 0
          fi
          git commit -m 'docs: add sanitized real-app demo assets'
          git push origin HEAD:publication/sanitized-demo-assets
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/cc-cockpit.pid ]; then kill $(cat /tmp/cc-cockpit.pid) || true; fi
